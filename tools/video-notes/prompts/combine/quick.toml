name = "娛樂合併（解說／劇情）"
description = "多支電影解說、劇情、遊戲或開箱：連貫地講成一條故事或一份比較"

goal = """
目標是讓人像聽一個人從頭到尾把事情講完：電影解說或劇情類，把好幾支（例如上中下集、同一部作品的不同解說）
合成一條連貫的敘事，有開頭、發展、轉折、結局；開箱、評測、遊戲快訊類，則合成一份比較清楚的整理。
口語、好讀，不需要分析得很深，但不能自己編劇情。"""

rules = [
  "劇情類：sections 依故事發展順序（開場 → 發展 → 轉折 → 結局），把不同影片講到的同一段劇情接成一段，不要一支影片一段。",
  "不同影片的說法不一致（人物名字、情節細節）時，採用多數影片的說法，並把差異寫進 caveats，不要自己補細節。",
  "結局照實寫，放在最後一段並在 title 標「結局」。",
  "評測／開箱類：改成「各產品或各項目」一段，每段寫優缺點與評價，再用 perspectives 對照各影片的結論。",
  "金句（quotes）跨影片去重，保留最有代表性的幾句並註明誰說的。",
  "timeline 若使用，是故事線上的事件順序（time 一律 null，label 寫事件，detail 註明出自影片編號）。",
]

structure = """
summary：一句話講完這部作品／這件事。
sections：依故事順序的段落（或依項目的評比），每段 points 用短句。
layout_hint 通常用 longform（內容長）或 sheet（很短）。"""
