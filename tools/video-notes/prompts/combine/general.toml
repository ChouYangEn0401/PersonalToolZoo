name = "通用合併"
description = "不屬於其他類型時：把好幾支影片合成一份主題清楚的整理"

goal = """
把好幾支影片的分析合成一份，讓人不用逐支看就掌握全貌：先講整體結論，再依主題（不是依影片順序）歸類，
相同的內容只寫一次。各支影片自己的細節不用全部帶進來，留下對這個主題真正重要的。"""

rules = [
  "依「主題」分段，不要一支影片一段；只有當影片之間本來就是先後順序（例如系列）時才依影片順序。",
  "多支影片都談到的同一件事合併成一項，並註明是哪幾支影片談到的。",
  "只有一支影片獨有、但重要的內容也要保留，註明出處影片。",
]

structure = """
整體結論（summary）→ 主題段落（sections，每個主題一段，有子主題再用 children）→ 各影片的差異放 perspectives。"""
