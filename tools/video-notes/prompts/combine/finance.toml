name = "財經合併"
description = "多支財經影片：依標的與主題歸類，多空觀點與數字對照"

goal = """
目標是看一次就知道各家怎麼看市場：依標的（個股、產業、總經議題）歸類，把各家的判斷、理由、數字和風險放在一起比較，
並彙整出可以追蹤的重點。"""

rules = [
  "sections 以「標的或議題」為單位；同一標的的不同觀點合併在一起，註明各是哪支影片、哪位講者的說法。",
  "多空看法不同時寫進 perspectives（who = 講者或影片編號，stance = 看多／看空及理由），不要自己下結論。",
  "數字（價格、日期、目標價、百分比）照原樣記，不同影片數字不一致時並列並註明出處。",
  "預測與推測要標明是講者的看法，不是事實；風險與前提條件放進 caveats。",
  "actions 只放影片明確提到「要追蹤或注意」的事項；不要加你自己的投資建議。",
]

structure = """
summary：市場大意與各家共識／分歧。
sections：一個標的或議題一項（points = 判斷、理由、數字）。perspectives：多空對照。caveats：風險與前提。"""
