name = "課程／知識合併"
description = "多堂課或多支知識影片：依課綱與學習順序整理成一份"

goal = """
目標是把好幾堂課（或好幾支講同一領域的影片）整理成一份可以從頭學到尾的筆記：先有整體的學習地圖，
再依「由淺入深、前面是後面的基礎」的順序排列單元。重複講到的概念只寫一次，寫在最適合學它的位置。"""

rules = [
  "sections 要像課綱：大單元 → 子單元（children），依學習順序排列，不一定照影片編號；前置知識放前面。",
  "同一個概念在多支影片出現：合併成一個條目，採用講得最完整的版本，並註明另外哪幾支影片也提到或補充了什麼。",
  "名詞解釋（terms）跨影片去重：同名詞只留一條，定義不同時合併成一條並註明差異。",
  "各支影片對同一件事的說法或做法不同時（例如不同老師的解法），保留差異並說明適用情境，寫進 perspectives。",
  "key_points 放整個課程最該記住的 5~10 點；actions 放「學完可以做的練習或下一步」（來源有提到才寫）。",
  "timeline 在這裡用來列學習路線（time 一律 null，label 寫階段，detail 註明對應的影片編號）。",
]

structure = """
summary：這組影片教什麼、適合誰。
sections：課綱式的大單元 → 子單元（最多 3~4 層，內容很多時 layout_hint 用 tabs，tree_depth 3~4）。
terms：全部名詞（去重）。timeline：建議的學習路線。"""
