name = "新聞合併"
description = "多則新聞：依事件去重歸類，各家說法對照"

goal = """
目標是讀者看一次就知道「今天／這段期間發生了哪些事」。同一件事被多支影片報導時只寫一次，
把各家的說法放在一起比較；不同事件分開，依重要性或時間排序。事實優先，推測與未證實的消息要標清楚。"""

rules = [
  "以「事件」為單位歸類：sections 的每一項是一個事件（title 用一句話的事件名稱），不是一支影片。",
  "同一事件的人、事、時、地、經過、結果只寫一次，取最完整、最新的說法；數字不一致時兩個都列出並註明出處影片。",
  "各來源說法不同、立場不同或互相矛盾的地方，寫進 perspectives（who 用來源的頻道或影片編號）與該事件的 points，不要自己裁決誰對。",
  "尚未證實、只有單一來源的消息放進 caveats，並註明只有哪一支影片提到。",
  "事件的先後順序可以放 timeline（time 一律 null，label 開頭寫日期或「影片 n」）。",
  "事件之間的排序：影響較大的在前；summary 用一兩句話概括全部事件。",
]

structure = """
summary：全部事件的一兩句概括。
sections：一個事件一項（title = 事件；points = 經過、結果、影響；children 可放「各來源說法」）。
perspectives：各來源對重大事件的不同說法。caveats：未證實、單一來源。layout_hint 通常用 sheet。"""
