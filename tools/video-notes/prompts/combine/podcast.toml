name = "Podcast／訪談合併"
description = "多集 Podcast 或訪談：依主題彙整觀點與來賓說法"

goal = """
目標是把好幾集節目整理成一份「這個主題大家怎麼說」：依主題歸類，保留各來賓／講者的觀點與代表性的原話，
讓人不用聽完每一集就知道討論的脈絡與分歧。"""

rules = [
  "sections 依主題歸類，不是依集數；每個主題下用 points 列出重點，註明是哪一集、哪位來賓說的。",
  "不同來賓的觀點、立場寫進 perspectives（who = 來賓名稱或集數）。",
  "好的原話放 quotes（保持原話、註明 speaker），跨集去重。",
  "節目的閒聊、開場、廣告不要寫進來。",
]

structure = """
summary：這幾集在談什麼、主要結論。
sections：主題 → 子主題。perspectives：各來賓觀點。quotes：代表性的話。"""
