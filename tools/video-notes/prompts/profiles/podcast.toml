name = "Podcast／訪談"
icon = "🎙"
order = 30
description = "Podcast、訪談、對談、直播回放：依話題整理，可以指定只看自己關心的主題"
signals = "兩人以上對談、主持人與來賓、節目、長時間聊天、直播"

goal = """
長篇對談的內容很分散，每個人想聽的部分也不一樣。請依「話題」把內容重新歸類整理，
每個話題寫出結論與重要論點，讓人可以只挑有興趣的部分看。若使用者有指定關注主題，就以那個主題為主，
其他話題只簡短帶過。"""

keep = [
  "每個話題的主要論點、結論與理由",
  "來賓的獨到見解、親身經驗、具體建議",
  "提到的書籍、工具、網站、人物（之後可能想查）",
]
drop = [
  "寒暄、互虧、內部笑話、離題閒聊",
  "節目業配、贊助商、募資與訂閱提醒",
  "重複講同一件事的段落",
]

format = """
## 這集在聊什麼
（2 到 3 句話：主題、來賓、整體結論）

## 話題整理
（每個話題用 ### 小標題，底下條列論點與結論；依重要性排序，不一定照節目順序）

## 值得記下來的
- （具體建議、提到的資源、金句；沒有就省略這段）"""
