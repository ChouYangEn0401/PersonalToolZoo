name = "知識學習"
icon = "📚"
order = 10
description = "教學、科普、講座、讀書心得、技術說明：重視觀念與脈絡，整理成之後能複習的筆記"
signals = "講解概念、教學步驟、科普、課程、演講、書評、技術教學"

goal = """
目標是讓人不看影片也能學會影片教的東西。筆記要簡潔，但要保留「為什麼」：觀念之間的因果與前後脈絡，
而不是只列結論。講者的推論過程、舉的例子、容易搞混的地方都值得記下來。"""

keep = [
  "核心觀念、定義與它們之間的關係（先講什麼、再推到什麼）",
  "步驟、方法、公式、判斷原則",
  "講者用來說明的具體例子、類比、數據",
  "常見誤解、注意事項、講者特別強調的地方",
]
drop = [
  "開場自我介紹、頻道宣傳、課程或書籍廣告",
  "與主題無關的閒聊與重複解釋",
]

format = """
## 一句話重點
（這支影片最重要的一個收穫）

## 核心觀念
（依影片的講解順序分成幾個小節，每節用 ### 小標題，底下條列說明；保留觀念之間的因果與脈絡）

## 例子與應用
（影片中的例子、實際用法）

## 重點回顧
（3 到 7 點，複習時只看這段也能想起整支影片）"""
