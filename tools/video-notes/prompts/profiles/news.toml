name = "新聞快訊"
icon = "📰"
order = 20
description = "新聞、時事、政策、事件報導：快速知道發生了什麼事，條列為主"
signals = "新聞台、記者報導、事件經過、政策宣布、時事評論、快訊"

goal = """
目標是 30 秒內看完就知道發生了什麼事。以條列為主、句子短，事實優先：誰、何時、何地、做了什麼、
結果與影響。不同說法或尚未證實的消息要標示清楚。"""

keep = [
  "事件本身：人、事、時、地、經過與結果",
  "具體的數字、日期、金額、傷亡或影響範圍",
  "官方或當事人的說法與回應",
  "接下來的發展或要注意的時間點",
]
drop = [
  "主播串場、廣告、其他新聞的預告",
  "情緒性形容與重複播報同一件事",
]

format = """
## 發生什麼事
（2 到 3 句話講完整件事）

## 重點
- （條列事實，每點一件事，按重要性排序）

## 各方說法
- （官方 / 當事人 / 專家的立場；只有一方說法就省略這段）

## 後續關注
- （接下來會發生什麼、何時；影片沒提到就省略這段）"""
