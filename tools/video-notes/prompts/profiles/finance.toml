goal = """
財經與產業節目常混雜大量節目效果：主持人串場、互相吹捧、玩笑、聳動標題、情緒性的喊話。
請判斷哪些是有依據的資訊與觀點、哪些只是節目效果，只整理前者。
每個觀點都要寫出「依據」（數據、財報、事件），並標明是誰的看法；沒有依據的推測要標示為推測。"""

keep = [
  "對產業、公司、市場的具體觀點，以及支撐觀點的數據、財報數字、事件",
  "提到的公司、股票代號、產品與技術",
  "時間點與催化劑（法說會、財報日、政策時程）",
  "風險與反方觀點",
]
drop = [
  "節目效果：串場、互捧、玩笑、聳動用語、情緒性喊話",
  "沒有任何依據的口號式預測（例如「一定會漲」），除非是節目的主要結論，此時要標示為推測",
  "節目或講者自己的課程、會員、群組廣告",
]

format = """
## 一句話結論
（這集最核心的判斷）

